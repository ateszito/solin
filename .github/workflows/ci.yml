name: Solin CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - prod
  pull_request:
    branches:
      - dev
      - master
      - staging
      - prod

permissions:
  contents: read
  deployments: write
  pull-requests: write
  statuses: write

concurrency:
  group: solin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    name: Validate PR & Promotion Path
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, solin, natasha]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enforce Promotion Path
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          echo "Checking PR Promotion Path: $HEAD -> $BASE"
          if [ "$BASE" = "master" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::Invalid promotion! PRs targeting 'master' must originate from 'dev'. Got '$HEAD'."
            exit 1
          fi
          if [ "$BASE" = "staging" ] && [ "$HEAD" != "master" ]; then
            echo "::error::Invalid promotion! PRs targeting 'staging' must originate from 'master'. Got '$HEAD'."
            exit 1
          fi
          if [ "$BASE" = "prod" ] && [ "$HEAD" != "staging" ]; then
            echo "::error::Invalid promotion! PRs targeting 'prod' must originate from 'staging'. Got '$HEAD'."
            exit 1
          fi
          echo "Promotion path ($HEAD -> $BASE) is valid."

      - name: Run Test Suite
        run: |
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            -e PYTHONPATH=/workspace/backend \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e SOLIN_MEDIA_ROOT=/tmp/solin_media \
            -e SOLIN_DATA_DIR=/tmp/solin_data \
            solin:dev-api pytest -o cache_dir=/tmp/.pytest_cache tests/

  deploy-dev:
    name: Deploy to Dev (Natasha)
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: [self-hosted, solin, natasha]
    environment:
      name: development
      url: https://solin-dev.ateszito.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Deploy to Dev
        run: python3 scripts/ci/deploy.py dev "${{ github.sha }}"

      - name: Rollback on Failure
        if: failure()
        run: python3 scripts/ci/rollback.py dev

  deploy-staging:
    name: Deploy to Staging (Natasha)
    if: github.event_name == 'push' && github.ref_name == 'staging'
    runs-on: [self-hosted, solin, natasha]
    environment:
      name: staging
      url: https://solin-staging.ateszito.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Deploy to Staging
        run: python3 scripts/ci/deploy.py staging "${{ github.sha }}"

      - name: Rollback on Failure
        if: failure()
        run: python3 scripts/ci/rollback.py staging

  deploy-prod:
    name: Deploy to Production (Natasha)
    if: github.event_name == 'push' && github.ref_name == 'prod'
    runs-on: [self-hosted, solin, natasha]
    environment:
      name: production
      url: https://solin.ateszito.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Deploy to Production
        run: python3 scripts/ci/deploy.py prod "${{ github.sha }}"

      - name: Rollback on Failure
        if: failure()
        run: python3 scripts/ci/rollback.py prod
